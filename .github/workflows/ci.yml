name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the toolchain that built the committed binaries: the Go
  # version is embedded in them, so a different patch release changes the hashes.
  GO_VERSION: "1.27.3"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      # On failure, copy the interesting lines into annotations: they are readable through the
      # API without logging in, which the raw job logs are not.
      - name: go test
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set +e   # the default is -e, which would end the step before the annotations are written
          go test -race ./... 2>&1 | tr -d '\r' | tee test.out
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E -- '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+|cgo|gcc|cannot |undefined|not found' test.out \
              | head -10 | sed 's/%/%25/g; s/^/::error::/'
            exit "$rc"
          fi
      - name: hooks through the launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          sh scripts/plugin-test.sh 2>&1 | tee hooks.out
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E -- 'FAIL|failed' hooks.out | head -10 | sed 's/%/%25/g; s/^/::error::/'
            exit "$rc"
          fi

  binaries:
    name: committed binaries match the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: rebuild, then fail if anything differs from what is committed
        run: make verify
      - name: every shipped script and binary is executable
        run: |
          bad=$(git ls-files -s plugin/bin plugin/scripts plugin/libexec | grep -v '\.exe$' | grep -v '^100755' || true)
          test -z "$bad" || { echo "not executable in git:"; echo "$bad"; exit 1; }
      - name: manifests are valid JSON and agree
        run: |
          jq -e . plugin/hooks/hooks.json .claude-plugin/marketplace.json > /dev/null
          jq -e '.name and .version' plugin/.claude-plugin/plugin.json > /dev/null
          test "$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)" = "./plugin"
