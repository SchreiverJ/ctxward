name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the toolchain that built the committed binaries: the Go
  # version is embedded in them, so a different patch release changes the hashes.
  GO_VERSION: "1.27.3"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - name: hooks through the launcher
        if: runner.os != 'Windows'
        run: sh scripts/plugin-test.sh

  binaries:
    name: committed binaries match the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: rebuild, then fail if anything differs from what is committed
        run: make verify
      - name: every shipped script and binary is executable
        run: |
          bad=$(git ls-files -s plugin/bin plugin/scripts plugin/libexec | grep -v '\.exe$' | grep -v '^100755' || true)
          test -z "$bad" || { echo "not executable in git:"; echo "$bad"; exit 1; }
      - name: manifests are valid JSON and agree
        run: |
          jq -e . plugin/hooks/hooks.json .claude-plugin/marketplace.json > /dev/null
          jq -e '.name and .version' plugin/.claude-plugin/plugin.json > /dev/null
          test "$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)" = "./plugin"
